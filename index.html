<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="robots" content="noindex">
<title>HRLOS 인증</title>
<style>
  :root {
    --bg:#111315; --card:#1c1f22; --line:#2c3035; --ink:#f2f4f5; --sub:#9aa1a8;
    --ok:#4ade80; --ok-bg:#16301f; --bad:#f87171; --bad-bg:#3a1d1d; --btn:#2a2e33; --btn-on:#3a4047;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--ink); }
  .card { width:100%; max-width:420px; background:var(--card); border-radius:22px; padding:32px 22px 22px; text-align:center; }
  .icon { width:84px; height:84px; margin:0 auto 18px; border-radius:50%; display:flex; align-items:center;
          justify-content:center; font-size:44px; font-weight:700; }
  .ok .icon { background:var(--ok-bg); color:var(--ok); }
  .bad .icon { background:var(--bad-bg); color:var(--bad); }
  h1 { font-size:22px; margin:0 0 22px; }
  .ok h1 { color:var(--ok); } .bad h1 { color:var(--bad); }
  hr { border:0; border-top:1px solid var(--line); margin:0 0 20px; }
  .label { font-size:13px; color:var(--sub); margin-bottom:6px; }
  .value { font-size:19px; font-weight:700; margin-bottom:18px; letter-spacing:.3px; }
  .note { font-size:13px; color:var(--sub); margin:4px 0 16px; line-height:1.5; }
  .foot { font-size:12px; color:var(--sub); margin-top:22px; }
  input { width:100%; height:52px; border-radius:12px; border:1px solid var(--line); background:var(--btn);
          color:var(--ink); font-size:18px; text-align:center; letter-spacing:6px; margin-bottom:10px; outline:none; }
  input::placeholder { letter-spacing:0; color:var(--sub); font-size:16px; }
  input:focus { border-color:var(--sub); }
  button { width:100%; height:52px; border-radius:12px; border:1px solid var(--line); background:var(--btn);
           color:var(--ink); font-size:16px; font-weight:700; cursor:pointer; }
  button:active { background:var(--btn-on); }
  button:disabled { opacity:.5; }
  .err { color:var(--bad); font-size:14px; min-height:20px; margin:4px 0 8px; }
  .spinner { width:44px; height:44px; margin:10px auto 18px; border:4px solid var(--line);
             border-top-color:var(--ok); border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spinner"></div>
  <p class="note">인증 확인 중입니다…</p>
</div>

<script>
  // ▼ Apps Script 웹앱 주소 (/exec 로 끝나는 주소). 배포 관리에서 복사한 주소와 같아야 합니다.
  const API_URL = 'https://script.google.com/macros/s/AKfycbyeE7bpjsjnT15IJJj5IWuOQRbOXMGcC4Y7CN2oKj4NUcHhzKCyFya65BWqjGYO7e18sg/exec';

  const card = document.getElementById('card');
  const code = (new URLSearchParams(location.search).get('code') || '').trim().toUpperCase();
  const esc = s => String(s == null ? '' : s).replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));

  function call(params) {
    const q = new URLSearchParams(Object.assign({ format: 'json', code: code }, params));
    // 구글 로그인 정보(쿠키)를 보내지 않기 때문에 다중계정이어도 /u/2/ 오류가 나지 않습니다.
    return fetch(API_URL + '?' + q.toString(), { credentials: 'omit' }).then(r => r.json());
  }

  // ① 인증 완료 (미사용) 화면 — PIN 입력 + 최종 사용 처리
  function showVerified(d) {
    card.className = 'card ok';
    card.innerHTML =
      '<div class="icon">✓</div>' +
      '<h1>HR소속 인증되었습니다</h1><hr>' +
      '<div class="label">인증번호</div><div class="value">' + esc(d.code) + '</div>' +
      '<div class="label">인증일시</div><div class="value">' + esc(d.authAt) + '</div>' +
      '<p class="note">실제 혜택 제공 후 현장 담당자가 최종 사용 처리를 진행해 주세요.</p>' +
      '<input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="담당자 PIN">' +
      '<div class="err" id="err"></div>' +
      '<button id="useBtn">최종 사용 처리</button>' +
      '<div class="foot">QR 조회만으로는 쿠폰이 소진되지 않습니다.</div>';

    const pin = document.getElementById('pin');
    const btn = document.getElementById('useBtn');
    const err = document.getElementById('err');
    pin.addEventListener('keydown', ev => { if (ev.key === 'Enter') btn.click(); });

    btn.addEventListener('click', () => {
      const v = pin.value.trim();
      if (!v) { err.textContent = '담당자 PIN을 입력해 주세요.'; pin.focus(); return; }
      btn.disabled = true; btn.textContent = '처리 중…'; err.textContent = '';
      call({ action: 'use', pin: v })
        .then(r => {
          if (r.ok && r.used) { showUsed(r); return; }
          err.textContent = r.message || '사용처리에 실패했습니다.';
          pin.value = ''; pin.focus();
          btn.disabled = false; btn.textContent = '최종 사용 처리';
        })
        .catch(() => {
          err.textContent = '연결 오류입니다. 잠시 후 다시 시도해 주세요.';
          btn.disabled = false; btn.textContent = '최종 사용 처리';
        });
    });
  }

  // ② 사용처리 완료 화면 (처리 직후 + 재스캔 시)
  function showUsed(d) {
    card.className = 'card ok';
    card.innerHTML =
      '<div class="icon">✓</div>' +
      '<h1>사용처리 완료되었습니다</h1><hr>' +
      '<div class="label">인증번호</div><div class="value">' + esc(d.code) + '</div>' +
      '<div class="label">사용처리 일시</div><div class="value">' + esc(d.usedAt || '-') + '</div>' +
      '<div class="foot">해당 인증번호는 사용완료 처리되었습니다.</div>';
  }

  // ③ 오류 화면
  function showError(title, msg) {
    card.className = 'card bad';
    card.innerHTML =
      '<div class="icon">!</div><h1>' + esc(title) + '</h1>' +
      '<p class="note">' + esc(msg) + '</p>' +
      (code ? '<div class="foot">인증번호 ' + esc(code) + '</div>' : '');
  }

  if (!code) {
    showError('잘못된 QR입니다', '쿠폰코드가 없습니다. 담당자에게 문의해 주세요.');
  } else {
    call({ action: 'check' })
      .then(d => {
        if (!d.ok) showError('인증 실패', d.message || '등록되지 않은 쿠폰입니다.');
        else if (d.used) showUsed(d);
        else showVerified(d);
      })
      .catch(() => showError('연결 오류', '잠시 후 다시 QR을 찍어주세요.'));
  }
</script>
</body>
</html>
